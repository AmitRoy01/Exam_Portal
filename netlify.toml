# Netlify configuration for Drive MCQ Exam.
# Static pages are served from /public by Netlify's CDN; the API runs as a Netlify Function.

[build]
  publish = "public"
  functions = "netlify/functions"
  # No build step is needed; run syntax checks and unit tests so a broken commit never deploys.
  command = "npm run check && npm test"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Ship these as regular node_modules instead of bundling (MongoDB driver has optional native deps).
  external_node_modules = ["mongoose", "mongodb", "connect-mongo", "express", "express-session"]

# Grade expired exam attempts every minute (replaces the server-side setInterval).
[functions."auto-grade"]
  schedule = "* * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Same security headers that helmet sets on the Express server, applied to the static pages.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self';base-uri 'self';font-src 'self' https: data:;form-action 'self';frame-ancestors 'self';img-src 'self' data:;object-src 'none';script-src 'self';script-src-attr 'none';style-src 'self' 'unsafe-inline';upgrade-insecure-requests;frame-src 'self' https://drive.google.com https://docs.google.com;connect-src 'self'"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Origin-Agent-Cluster = "?1"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-DNS-Prefetch-Control = "off"
    X-Download-Options = "noopen"
    X-Frame-Options = "SAMEORIGIN"
    X-Permitted-Cross-Domain-Policies = "none"
    X-XSS-Protection = "0"
